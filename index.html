<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>cyhgb</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,340;9..144,560&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #05060B;
    --ink: #F1EDE4;
    --ink-dim: #8C8FA3;
    --amber: #E8A857;
    --violet: #8C7BC7;
    --serif: 'Fraunces', Georgia, serif;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--mono);
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- Sky ---------- */
  #sky{
    position:fixed; inset:0;
    z-index:0;
  }
  .nebula{
    position:fixed; inset:0; z-index:0;
    background:
      radial-gradient(ellipse 700px 500px at 78% 22%, rgba(140,123,199,0.16), transparent 60%),
      radial-gradient(ellipse 600px 450px at 15% 75%, rgba(232,168,87,0.10), transparent 60%),
      radial-gradient(ellipse 900px 700px at 50% 100%, rgba(62,110,100,0.10), transparent 65%);
    pointer-events:none;
  }

  /* ---------- Content ---------- */
  main{
    position:relative; z-index:2;
    min-height:100vh;
    display:flex; flex-direction:column;
    align-items:flex-start;
    justify-content:center;
    padding: 8vh 8vw;
  }

  .kicker{
    font-size:0.78rem;
    letter-spacing:0.04em;
    color:var(--ink-dim);
    margin-bottom:22px;
    opacity:0;
    animation: rise 0.7s ease forwards 0.1s;
  }
  .kicker .dot{color:var(--amber);}

  h1{
    font-family:var(--serif);
    font-weight:340;
    font-size:clamp(3.2rem, 12vw, 8.5rem);
    line-height:0.92;
    letter-spacing:-0.01em;
    opacity:0;
    animation: rise 0.9s ease forwards 0.25s;
  }

  .decode-line{
    margin-top:34px;
    font-size:clamp(0.95rem, 1.6vw, 1.15rem);
    color:var(--ink-dim);
    max-width:640px;
    min-height:1.6em;
    opacity:0;
    animation: rise 0.7s ease forwards 1.1s;
  }
  .decode-line .cursor{
    display:inline-block;
    width:0.5em;
    background:var(--amber);
    animation: blink 1s step-end infinite;
  }

  .rot13-label{
    font-family:var(--mono);
    color:var(--ink-dim);
    font-size:1.03rem;
    letter-spacing:0.04em;
    margin-right:0.4em;
  }

  .raw-b64{
    margin-top:10px;
    font-size:0.72rem;
    color:#4A4D5E;
    word-break:break-all;
    max-width:640px;
    opacity:0;
    animation: rise 0.6s ease forwards 1.3s;
  }

  .links{
    margin-top:56px;
    display:flex; gap:28px; flex-wrap:wrap;
    opacity:0;
    animation: rise 0.7s ease forwards 1.5s;
  }
  .links a{
    color:var(--ink);
    text-decoration:none;
    font-size:0.85rem;
    border-bottom:1px solid rgba(241,237,228,0.25);
    padding-bottom:3px;
    transition:border-color 0.2s ease, color 0.2s ease;
  }
  .links a:hover, .links a:focus-visible{
    color:var(--amber);
    border-color:var(--amber);
  }

  .coords{
    position:fixed;
    bottom:28px; right:8vw;
    z-index:2;
    font-size:0.7rem;
    color:#4A4D5E;
    text-align:right;
    opacity:0;
    animation: rise 0.6s ease forwards 1.7s;
  }

  @keyframes rise{
    from{opacity:0; transform:translateY(14px);}
    to{opacity:1; transform:translateY(0);}
  }
  @keyframes blink{
    50%{opacity:0;}
  }

  :focus-visible{outline:2px solid var(--amber); outline-offset:3px;}
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.01ms !important; animation-iteration-count:1 !important;}
  }
  @media (max-width:640px){
    main{padding:7vh 7vw;}
    .coords{display:none;}
  }
</style>
</head>
<body>

<canvas id="sky"></canvas>
<div class="nebula"></div>

<main>
  <div class="kicker">physics <span class="dot">&middot;</span> astronomy <span class="dot">&middot;</span> mathematics</div>
  <h1>cyhgb</h1>
  <div class="decode-line" id="decodeLine"><span class="rot13-label">ROT 13_</span><span class="cursor">&nbsp;</span></div>
  <div class="raw-b64" id="rawB64"></div>
</main>

<div class="coords" id="coords"></div>

<script>
  // ---- Encoded message (edit the plain text below, it re-encodes itself) ----
  const message = "training for NSEP, NSEA, IOAA and JEE — mechanics, relativity, and the sky";
  const encoded = btoa(message);

  document.getElementById('rawB64').textContent = encoded;

  // Typewriter decode effect
  const target = document.getElementById('decodeLine');
  let i = 0;
  function type(){
    if(i <= message.length){
      target.innerHTML = message.slice(0, i) + '<span class="rot13-label">ROT 13_</span><span class="cursor">&nbsp;</span>';
      i++;
      setTimeout(type, 28);
    }
  }
  setTimeout(type, 1150);

  // Starfield canvas — cheap, no external assets
  const canvas = document.getElementById('sky');
  const ctx = canvas.getContext('2d');
  let stars = [];
  function resize(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    const count = Math.floor((canvas.width * canvas.height) / 5000);
    stars = Array.from({length: count}, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: Math.random() * 1.1 + 0.2,
      baseAlpha: Math.random() * 0.6 + 0.15,
      twinkleSpeed: Math.random() * 0.015 + 0.003,
      phase: Math.random() * Math.PI * 2
    }));
  }
  let t = 0;
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function draw(){
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#F1EDE4';
    for(const s of stars){
      const a = reduceMotion ? s.baseAlpha : s.baseAlpha + Math.sin(t * s.twinkleSpeed + s.phase) * 0.25;
      ctx.globalAlpha = Math.max(0, a);
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    t++;
    requestAnimationFrame(draw);
  }
  resize();
  window.addEventListener('resize', resize);
  draw();

  // Small orientation readout, cosmetic
  document.getElementById('coords').textContent =
    'RA 05h 34m 32s   DEC +22° 00\' 52"   (Crab Nebula, for no particular reason)';
</script>

</body>
</html>
