<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CYHGB</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css">

   

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <style>

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        body {
            background: #000c10;
            color: #fff;
            font-family: KaTeX_Main, "Times New Roman", serif;
            overflow: hidden;
        }

        /* Moving background */

        .background {
            position: fixed;
            inset: -50%;
            width: 200%;
            height: 200%;

            background:
                radial-gradient(
                    circle at 30% 40%,
                    rgba(50, 70, 90, 0.07),
                    transparent 25%
                ),
                radial-gradient(
                    circle at 70% 60%,
                    rgba(70, 90, 110, 0.04),
                    transparent 25%
                );
                
            animation: drift 20s ease-in-out infinite alternate;
            z-index: -2;
        }

        @keyframes drift {
            0% {
                transform: translate(-5%, -3%) rotate(0deg);
            }

            50% {
                transform: translate(4%, 5%) rotate(3deg);
            }

            100% {
                transform: translate(-2%, -4%) rotate(-3deg);
            }
        }

        /* Main content */

        main {
            width: 100%;
            height: 100vh;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            position: relative;
            z-index: 1;
        }

        h1 {
            margin: 0 0 25px 0;
            font-family: 'Press Start 2P', monospace;
            font-size: 64px;
            font-weight: 400;
            letter-spacing: 12px;
        }

        p {
            margin: 0 0 45px 0;
            font-size: 18px;
            font-style: italic;
            letter-spacing: 2px;
        }

        /* Galaxy */

        .galaxy {
            width: min(650px, 75vw);
            max-height: 45vh;
            object-fit: contain;

            opacity: 0.9;

            
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-12px);
            }
        }

    </style>
</head>

<body>

    <div class="background"></div>

    <main>

        <h1>CYHGB</h1>

        <p>aGkgdGhpcyBpcyBjeWhnYiwgaSBsb3ZlIGFzdHJvcGh5c2ljcywgcGh5c2ljcyBhbmQgbWF0aA==</p>

        <img class="galaxy" src="galaxy.jpg" alt="Galaxy">

    </main>

</body>

</html>
