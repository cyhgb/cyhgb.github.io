<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>cyhgb</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,340;9..144,560&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #05060B;
    --ink: #F1EDE4;
    --ink-dim: #8C8FA3;
    --amber: #E8A857;
    --violet: #8C7BC7;
    --serif: 'Fraunces', Georgia, serif;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--mono);
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- Sky ---------- */
  #sky{
    position:fixed; inset:0;
    z-index:0;
  }
  .nebula{
    position:fixed; inset:0; z-index:0;
    background:
      radial-gradient(ellipse 700px 500px at 78% 22%, rgba(140,123,199,0.16), transparent 60%),
      radial-gradient(ellipse 600px 450px at 15% 75%, rgba(232,168,87,0.10), transparent 60%),
      radial-gradient(ellipse 900px 700px at 50% 100%, rgba(62,110,100,0.10), transparent 65%);
    pointer-events:none;
  }

  /* ---------- Content ---------- */
  main{
    position:relative; z-index:2;
    min-height:100vh;
    display:flex; flex-direction:column;
    align-items:flex-start;
    justify-content:center;
    padding: 8vh 8vw;
  }

  .kicker{
    font-size:0.78rem;
    letter-spacing:0.04em;
    color:var(--ink-dim);
    margin-bottom:22px;
    opacity:0;
    animation: rise 0.7s ease forwards 0.1s;
  }
  .kicker .dot{color:var(--amber);}

  h1{
    font-family:var(--serif);
    font-weight:340;
    font-size:clamp(3.2rem, 12vw, 8.5rem);
    line-height:0.92;
    letter-spacing:-0.01em;
    opacity:0;
    animation: rise 0.9s ease forwards 0.25s;
  }

  .decode-line{
    margin-top:34px;
    font-size:clamp(0.95rem, 1.6vw, 1.15rem);
    color:var(--ink-dim);
    max-width:640px;
    min-height:1.6em;
    opacity:0;
    animation: rise 0.7s ease forwards 1.1s;
  }
  .decode-line .cursor{
    display:inline-block;
    width:0.5em;
    background:var(--amber);
    animation: blink 1s step-end infinite;
  }

  .rot13-label{
    font-family:var(--mono);
    color:var(--ink-dim);
    font-size:0.78rem;
    letter-spacing:0.04em;
    margin-right:0.4em;
  }

  .raw-b64{
    margin-top:10px;
    font-size:0.72rem;
    color:#4A4D5E;
    word-break:break-all;
    max-width:640px;
    opacity:0;
    animation: rise 0.6s ease forwards 1.3s;
  }

  .links{
    margin-top:56px;
    display:flex; gap:28px; flex-wrap:wrap;
    opacity:0;
    animation: rise 0.7s ease forwards 1.5s;
  }
  .links a{
    color:var(--ink);
    text-decoration:none;
    font-size:0.85rem;
    border-bottom:1px solid rgba(241,237,228,0.25);
    padding-bottom:3px;
    transition:border-color 0.2s ease, color 0.2s ease;
  }
  .links a:hover, .links a:focus-visible{
    color:var(--amber);
    border-color:var(--amber);
  }

  .coords{
    position:fixed;
    left:8vw; bottom:6vh;
    font-size:0.7rem;
    color:#4A4D5E;
    text-align:left;
    opacity:0;
    animation: rise 0.6s ease forwards 1.7s;
  }

  .blackhole-wrap{
    position:fixed;
    top:50%;
    right:6vw;
    transform:translateY(-50%);
    width:min(46vw, 660px);
    aspect-ratio:600 / 400;
    z-index:1;
    pointer-events:none;
    opacity:0;
    animation: bh-in 1.6s ease forwards 0.5s;
  }
  .blackhole-wrap svg{
    display:block;
    width:100%;
    height:100%;
    overflow:visible;
  }
  .disk-rotate{
    transform-box:view-box;
    transform-origin:50% 50%;
  }
  .disk-flow{
    animation:flowDash 16s linear infinite;
  }
  @keyframes flowDash{
    from{stroke-dashoffset:0;}
    to{stroke-dashoffset:-994;}
  }
  .jet-pulse{
    animation:jetPulse 2.6s ease-in-out infinite alternate;
  }
  @keyframes jetPulse{
    from{opacity:0.5;}
    to{opacity:1;}
  }
  .jet-flow{
    animation:jetFlow 2.2s linear infinite;
  }
  @keyframes jetFlow{
    from{stroke-dashoffset:0;}
    to{stroke-dashoffset:-120;}
  }
  @keyframes bh-in{
    from{opacity:0; transform:translateY(-50%) scale(0.94);}
    to{opacity:1; transform:translateY(-50%) scale(1);}
  }
  @media (max-width:900px){
    .blackhole-wrap{
      width:min(70vw, 480px);
      top:auto; bottom:2vh; right:6vw; transform:none;
      opacity:0.5;
    }
    @keyframes bh-in{ from{opacity:0;} to{opacity:0.5;} }
  }

  @keyframes rise{
    from{opacity:0; transform:translateY(14px);}
    to{opacity:1; transform:translateY(0);}
  }
  @keyframes blink{
    50%{opacity:0;}
  }

  :focus-visible{outline:2px solid var(--amber); outline-offset:3px;}
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.01ms !important; animation-iteration-count:1 !important;}
  }
  @media (max-width:640px){
    main{padding:7vh 7vw;}
    .coords{display:none;}
  }
</style>
</head>
<body>

<canvas id="sky"></canvas>
<div class="nebula"></div>

<div class="blackhole-wrap" aria-hidden="true">
  <svg viewBox="0 0 600 400" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="bhGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#E8A857" stop-opacity="0.30"/>
        <stop offset="45%" stop-color="#8C7BC7" stop-opacity="0.12"/>
        <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="bhDisk" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#3E6E64" stop-opacity="0"/>
        <stop offset="15%" stop-color="#8C7BC7" stop-opacity="0.55"/>
        <stop offset="50%" stop-color="#E8A857" stop-opacity="0.95"/>
        <stop offset="85%" stop-color="#8C7BC7" stop-opacity="0.55"/>
        <stop offset="100%" stop-color="#3E6E64" stop-opacity="0"/>
      </linearGradient>
      <radialGradient id="bhHorizon" cx="42%" cy="38%" r="68%">
        <stop offset="0%" stop-color="#0D0E16"/>
        <stop offset="100%" stop-color="#000000"/>
      </radialGradient>
      <filter id="bhSoftBlur" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="6"/>
      </filter>
      <filter id="bhRingBlur" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="2"/>
      </filter>
      <clipPath id="bhFrontClip">
        <path d="M 208 200 A 92 92 0 0 1 392 200 Z"/>
      </clipPath>
      <linearGradient id="beamGradUp" x1="0" y1="0%" x2="0" y2="100%">
        <stop offset="0%" stop-color="#F1EDE4" stop-opacity="0"/>
        <stop offset="65%" stop-color="#E8A857" stop-opacity="0.5"/>
        <stop offset="100%" stop-color="#F1EDE4" stop-opacity="0.95"/>
      </linearGradient>
      <linearGradient id="beamGradDown" x1="0" y1="0%" x2="0" y2="100%">
        <stop offset="0%" stop-color="#F1EDE4" stop-opacity="0.95"/>
        <stop offset="35%" stop-color="#E8A857" stop-opacity="0.5"/>
        <stop offset="100%" stop-color="#F1EDE4" stop-opacity="0"/>
      </linearGradient>
      <radialGradient id="poleFlare" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#F1EDE4" stop-opacity="0.95"/>
        <stop offset="40%" stop-color="#E8A857" stop-opacity="0.55"/>
        <stop offset="100%" stop-color="#E8A857" stop-opacity="0"/>
      </radialGradient>
    </defs>

    <g transform="rotate(-12 300 200)">
      <circle cx="300" cy="200" r="220" fill="url(#bhGlow)"/>

      <g class="disk-rotate">
        <ellipse cx="300" cy="200" rx="230" ry="62" fill="none" stroke="url(#bhDisk)" stroke-width="16" opacity="0.8" filter="url(#bhSoftBlur)"/>
        <ellipse cx="300" cy="200" rx="230" ry="62" fill="none" stroke="url(#bhDisk)" stroke-width="4" opacity="0.9"/>
        <ellipse class="disk-flow" cx="300" cy="200" rx="230" ry="62" fill="none" stroke="#F1EDE4" stroke-width="3" stroke-linecap="round" opacity="0.55" stroke-dasharray="50 447 50 447" filter="url(#bhRingBlur)"/>
      </g>

      <circle cx="300" cy="200" r="92" fill="url(#bhHorizon)"/>

      <g clip-path="url(#bhFrontClip)">
        <ellipse cx="300" cy="200" rx="230" ry="62" fill="none" stroke="url(#bhDisk)" stroke-width="16" opacity="0.85" filter="url(#bhSoftBlur)"/>
        <ellipse cx="300" cy="200" rx="230" ry="62" fill="none" stroke="url(#bhDisk)" stroke-width="4" opacity="0.95"/>
        <ellipse class="disk-flow" cx="300" cy="200" rx="230" ry="62" fill="none" stroke="#F1EDE4" stroke-width="3" stroke-linecap="round" opacity="0.6" stroke-dasharray="50 447 50 447" filter="url(#bhRingBlur)"/>
      </g>

      <ellipse cx="300" cy="200" rx="112" ry="30" fill="none" stroke="#F1EDE4" stroke-width="2" opacity="0.5" filter="url(#bhRingBlur)"/>
      <ellipse cx="300" cy="200" rx="100" ry="26" fill="none" stroke="#E8A857" stroke-width="1.2" opacity="0.8"/>

      <polygon points="272,108 328,108 300,-1800" fill="url(#beamGradUp)" opacity="0.45" filter="url(#bhSoftBlur)"/>
      <polygon points="290,108 310,108 300,-1800" fill="url(#beamGradUp)" opacity="0.85" class="jet-pulse"/>
      <line x1="300" y1="108" x2="300" y2="-1800" stroke="#F1EDE4" stroke-width="3" stroke-linecap="round" stroke-dasharray="14 46" opacity="0.75" filter="url(#bhRingBlur)" class="jet-flow"/>

      <polygon points="272,292 328,292 300,2000" fill="url(#beamGradDown)" opacity="0.45" filter="url(#bhSoftBlur)"/>
      <polygon points="290,292 310,292 300,2000" fill="url(#beamGradDown)" opacity="0.85" class="jet-pulse"/>
      <line x1="300" y1="292" x2="300" y2="2000" stroke="#F1EDE4" stroke-width="3" stroke-linecap="round" stroke-dasharray="14 46" opacity="0.75" filter="url(#bhRingBlur)" class="jet-flow"/>

      <circle cx="300" cy="108" r="30" fill="url(#poleFlare)" filter="url(#bhSoftBlur)" class="jet-pulse"/>
      <circle cx="300" cy="292" r="30" fill="url(#poleFlare)" filter="url(#bhSoftBlur)" class="jet-pulse"/>
    </g>
  </svg>
</div>

<main>
  <div class="kicker">physics <span class="dot">&middot;</span> astronomy <span class="dot">&middot;</span> mathematics</div>
  <h1>cyhgb</h1>
  <div class="decode-line" id="decodeLine"><span class="rot13-label">ROT 13_</span><span class="cursor">&nbsp;</span></div>
  <div class="raw-b64" id="rawB64"></div>
</main>

<div class="coords" id="coords"></div>

<script>
  // ---- Encoded message (edit the plain text below, it re-encodes itself) ----
  const message = "hi this is cyhgb, i love astrophysics, physics and math";
  const encoded = btoa(unescape(encodeURIComponent(message)));

  document.getElementById('rawB64').textContent = encoded;

  // Starfield canvas — cheap, no external assets
  const canvas = document.getElementById('sky');
  const ctx = canvas.getContext('2d');
  let stars = [];
  function resize(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    const count = Math.floor((canvas.width * canvas.height) / 5000);
    stars = Array.from({length: count}, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: Math.random() * 1.1 + 0.2,
      baseAlpha: Math.random() * 0.6 + 0.15,
      twinkleSpeed: Math.random() * 0.015 + 0.003,
      phase: Math.random() * Math.PI * 2
    }));
  }
  let t = 0;
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function draw(){
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#F1EDE4';
    for(const s of stars){
      const a = reduceMotion ? s.baseAlpha : s.baseAlpha + Math.sin(t * s.twinkleSpeed + s.phase) * 0.25;
      ctx.globalAlpha = Math.max(0, a);
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    t++;
    requestAnimationFrame(draw);
  }
  resize();
  window.addEventListener('resize', resize);
  draw();

  // Small orientation readout, cosmetic
  document.getElementById('coords').textContent =
    'RA 10h 02m 42s   DEC -60° 06\' 00"';
</script>

</body>
</html>
